spring.application.name=payment-service
server.port=8086
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Host-run default; Docker and tests override via SPRING_DATASOURCE_* / @ServiceConnection.
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce
spring.datasource.username=ecommerce
spring.datasource.password=ecommerce

# Payment Service owns schema "payment_service"
spring.flyway.schemas=payment_service
spring.flyway.default-schema=payment_service
spring.flyway.enabled=true
spring.jpa.properties.hibernate.default_schema=payment_service

# Plain JDBC resolves unqualified table names in the same schema
spring.datasource.hikari.schema=payment_service

# JPA DDL validation (Flyway manages schema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.cloud.openfeign.client.config.paymentIdentity.connectTimeout=2000
spring.cloud.openfeign.client.config.paymentIdentity.readTimeout=2000
payment.internal.finance-token=${PAYMENT_INTERNAL_FINANCE_TOKEN:}
spring.cloud.openfeign.client.config.orderCollectionReview.connectTimeout=2000
spring.cloud.openfeign.client.config.orderCollectionReview.readTimeout=2000
spring.cloud.openfeign.client.config.orderCheckoutPayable.connectTimeout=2000
spring.cloud.openfeign.client.config.orderCheckoutPayable.readTimeout=2000

# Paging 1-indexed
spring.data.web.pageable.one-indexed-parameters=true
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Logging pattern with requestId MDC
logging.pattern.level=%5p [%X{requestId:-}]

# Internal Payment Simulator configuration (REQ-PAY-001)
payment.simulator.scenario=SUCCESS
