x-eureka-client: &eureka-client
  depends_on:
    discovery-service:
      condition: service_healthy
  environment: &eureka-client-env
    SPRING_APPLICATION_JSON: &eureka-url-json '{"eureka":{"client":{"serviceUrl":{"defaultZone":"http://discovery-service:8761/eureka/"}}}}'
    SPRING_DATASOURCE_URL: ${DB_JDBC_URL:?Set DB_JDBC_URL in .env}
    SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
    SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

services:
  # Optional local PostgreSQL; the default stack uses the datasource from .env.
  database:
    profiles: ["local-db"]
    image: postgres:16
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 12

  # S3-compatible object storage (SeaweedFS) for presigned media uploads. Dev credentials in identity-service/infra/seaweedfs/s3.json.
  object-storage:
    image: chrislusf/seaweedfs:4.45
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -ip.bind=0.0.0.0
    ports:
      - "127.0.0.1:${S3_HOST_PORT:-8333}:8333"
    volumes:
      - ./identity-service/infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - object-storage-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  discovery-service:
    build: ./discovery-service
    volumes:
      - ./discovery-service/src:/app/src:ro
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  cart-service:
    <<: *eureka-client
    build: ./cart-service
    volumes:
      - ./cart-service/src:/app/src:ro
    environment:
      <<: *eureka-client-env
      # Dev-only shared secret; identity-service must list the same value as IDENTITY_INTERNAL_TOKEN_CART.
      CART_SERVICE_TOKEN: ${IDENTITY_INTERNAL_TOKEN_CART:-cart-service-dev-token-0123456789abcdef}
      CART_INTERNAL_ORDER_TOKEN: ${ORDER_TO_CART_TOKEN:-}
      CART_PRODUCT_TOKEN: ${E1_CART_TO_PRODUCT_TOKEN:-}
      CART_ORDER_TOKEN: ${CART_TO_ORDER_TOKEN:-}
      CART_KAFKA_ENABLED: "true"
      CART_CHECKOUT_PAID_TOPIC: ecommerce.order.events.v1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"

  gateway-service:
    <<: *eureka-client
    build: ./gateway-service
    volumes:
      - ./gateway-service/src:/app/src:ro
    # No database: only wait for Eureka and only pass its URL (no SPRING_DATASOURCE_*).
    depends_on:
      discovery-service:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_JSON: *eureka-url-json
      # Token keys from identity-service, fetched on the first token (the gateway doesn't wait for identity to start).
      GATEWAY_JWT_JWK_SET_URI: http://identity-service:8083/.well-known/jwks.json
      # The SPA's origin(s), comma-separated (CORS with credentials, decision 0001).
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      # The dev image compiles before it starts (mvn spring-boot:run).
      start_period: 120s

  finance-service:
    <<: *eureka-client
    build: ./finance-service
    volumes:
      - ./finance-service/src:/app/src:ro
    environment:
      <<: *eureka-client-env
      FINANCE_INTERNAL_TOKENS_ORDER: ${E1_ORDER_TO_FINANCE_TOKEN:-}
      FINANCE_IDENTITY_BASE_URL: http://identity-service:8083
      FINANCE_IDENTITY_SERVICE_TOKEN: ${PHASE4_FINANCE_TO_IDENTITY_TOKEN:-}
      FINANCE_ORDER_BASE_URL: http://order-service:8085
      FINANCE_ORDER_CREDENTIAL: ${PHASE4_FINANCE_TO_ORDER_TOKEN:-}
      FINANCE_PAYMENT_BASE_URL: http://payment-service:8086
      FINANCE_PAYMENT_CREDENTIAL: ${PHASE4_FINANCE_TO_PAYMENT_TOKEN:-}
      FINANCE_INTERNAL_TOKENS_IDENTITY: ${IDENTITY_OBLIGATIONS_SERVICE_TOKEN:-}
      FINANCE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "18082:8082"

  identity-service:
    <<: *eureka-client
    build: ./identity-service
    volumes:
      - ./identity-service/src:/app/src:ro
    environment:
      <<: *eureka-client-env
      # Uploads are signed for the browser's view of the storage; identity itself talks to it inside the network.
      IDENTITY_MEDIA_ENDPOINT: http://object-storage:8333
      IDENTITY_MEDIA_PUBLIC_ENDPOINT: http://localhost:${S3_HOST_PORT:-8333}
      IDENTITY_ORDER_BASE_URL: http://order-service:8085
      IDENTITY_INTERNAL_TOKEN_CART: ${IDENTITY_INTERNAL_TOKEN_CART:-cart-service-dev-token-0123456789abcdef}
      IDENTITY_INTERNAL_TOKEN_ORDER: ${E1_ORDER_TO_IDENTITY_TOKEN:-}
      IDENTITY_INTERNAL_TOKEN_PRODUCT: ${E1_PRODUCT_TO_IDENTITY_TOKEN:-}
      IDENTITY_INTERNAL_TOKEN_FINANCE: ${PHASE4_FINANCE_TO_IDENTITY_TOKEN:-}
      IDENTITY_INTERNAL_TOKEN_PAYMENT: ${PHASE4_PAYMENT_TO_IDENTITY_TOKEN:-}
      IDENTITY_OBLIGATIONS_SERVICE_TOKEN: ${IDENTITY_OBLIGATIONS_SERVICE_TOKEN:-}
      IDENTITY_FINANCE_BASE_URL: http://finance-service:8082
      IDENTITY_KAFKA_ENABLED: "true"
      IDENTITY_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      IDENTITY_INTERNAL_TOKEN_NOTIFICATION: ${IDENTITY_INTERNAL_TOKEN_NOTIFICATION:-notification-service-dev-token-0123456789abcdef}
      # Google sign-in (customers): the web app's OAuth client id; empty = off (POST /auth/google answers 503).
      IDENTITY_GOOGLE_CLIENT_ID: ${IDENTITY_GOOGLE_CLIENT_ID:-}
    ports:
      - "18083:8083"

  notification-service:
    <<: *eureka-client
    build: ./notification-service
    volumes:
      - ./notification-service/src:/app/src:ro
    environment:
      <<: *eureka-client-env
      NOTIFICATION_SERVICE_TOKEN: ${IDENTITY_INTERNAL_TOKEN_NOTIFICATION:-notification-service-dev-token-0123456789abcdef}
      NOTIFICATION_INTERNAL_TOKEN_PRODUCT: ${IDENTITY_INTERNAL_TOKEN_PRODUCT:-product-service-test-token-0123456789abcdef}
      NOTIFICATION_INTERNAL_TOKEN_IDENTITY: ${NOTIFICATION_INTERNAL_TOKEN_IDENTITY:-}
      NOTIFICATION_INTERNAL_TOKEN_ORDER: ${NOTIFICATION_INTERNAL_TOKEN_ORDER:-}
      NOTIFICATION_INTERNAL_TOKEN_PAYMENT: ${NOTIFICATION_INTERNAL_TOKEN_PAYMENT:-}
      NOTIFICATION_INTERNAL_TOKEN_FINANCE: ${NOTIFICATION_INTERNAL_TOKEN_FINANCE:-}
    ports:
      - "8084:8084"

  order-service:
    <<: *eureka-client
    build: ./order-service
    volumes:
      - ./order-service/src:/app/src:ro
    environment:
      <<: *eureka-client-env
      ORDER_IDENTITY_BASE_URL: http://identity-service:8083
      ORDER_IDENTITY_SERVICE_TOKEN: ${E1_ORDER_TO_IDENTITY_TOKEN:-}
      ORDER_PRODUCT_BASE_URL: http://product-service:8087
      ORDER_PRODUCT_SERVICE_TOKEN: ${E1_ORDER_TO_PRODUCT_TOKEN:-}
      ORDER_CART_BASE_URL: http://cart-service:8080
      ORDER_CART_SERVICE_TOKEN: ${ORDER_TO_CART_TOKEN:-}
      ORDER_INTERNAL_TOKEN_CART: ${CART_TO_ORDER_TOKEN:-}
      ORDER_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ORDER_CHECKOUT_QUOTE_KEY: ${ORDER_CHECKOUT_QUOTE_KEY:-}
      ORDER_CHECKOUT_DELIVERY_ENABLED: ${ORDER_CHECKOUT_DELIVERY_ENABLED:-false}
      ORDER_CHECKOUT_DELIVERY_REGION: ${ORDER_CHECKOUT_DELIVERY_REGION:-us-east-1}
      ORDER_CHECKOUT_DELIVERY_ENDPOINT: ${ORDER_CHECKOUT_DELIVERY_ENDPOINT:-http://sqs:9324}
      ORDER_CHECKOUT_DELIVERY_QUEUE_URL: ${ORDER_CHECKOUT_DELIVERY_QUEUE_URL:-}
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
      ORDER_INTERNAL_TOKEN_PRODUCT: ${E1_PRODUCT_TO_ORDER_TOKEN:-}
      ORDER_PAYMENT_BASE_URL: http://payment-service:8086
      ORDER_PAYMENT_SERVICE_TOKEN: ${E1_ORDER_TO_PAYMENT_TOKEN:-}
      ORDER_INTERNAL_TOKEN_PAYMENT: ${E1_PAYMENT_TO_ORDER_TOKEN:-}
      ORDER_INTERNAL_TOKEN_FINANCE: ${PHASE4_FINANCE_TO_ORDER_TOKEN:-}
      ORDER_INTERNAL_TOKENS_IDENTITY: ${IDENTITY_OBLIGATIONS_SERVICE_TOKEN:-}
      ORDER_FINANCE_BASE_URL: http://finance-service:8082
      ORDER_FINANCE_SERVICE_TOKEN: ${E1_ORDER_TO_FINANCE_TOKEN:-}
    ports:
      - "8085:8085"

  payment-service:
    <<: *eureka-client
    build: ./payment-service
    volumes:
      - ./payment-service/src:/app/src:ro
    environment:
      <<: *eureka-client-env
      PAYMENT_ORDER_BASE_URL: http://order-service:8085
      PAYMENT_ORDER_CREDENTIAL: ${E1_PAYMENT_TO_ORDER_TOKEN:-}
      PAYMENT_INTERNAL_ORDER_TOKEN: ${E1_ORDER_TO_PAYMENT_TOKEN:-}
      PAYMENT_INTERNAL_FINANCE_TOKEN: ${PHASE4_FINANCE_TO_PAYMENT_TOKEN:-}
      PAYMENT_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYMENT_PROVIDER_BASE_URL: ${PAYMENT_PROVIDER_BASE_URL:-http://127.0.0.1:8089}
      PAYMENT_PROVIDER_CREDENTIAL_HEADER: ${PAYMENT_PROVIDER_CREDENTIAL_HEADER:-X-Provider-Key}
      PAYMENT_PROVIDER_CREDENTIAL: ${PAYMENT_PROVIDER_CREDENTIAL:-demo-provider-dev-key-0123456789}
      PAYMENT_PROVIDER_WEBHOOK_SECRET: ${PAYMENT_PROVIDER_WEBHOOK_SECRET:-demo-provider-webhook-secret-0123456789}
      PAYMENT_REFUND_QUERY_INTERVAL: ${PAYMENT_REFUND_QUERY_INTERVAL:-PT5S}
      PAYMENT_IDENTITY_BASE_URL: http://identity-service:8083
      PAYMENT_IDENTITY_SERVICE_TOKEN: ${PHASE4_PAYMENT_TO_IDENTITY_TOKEN:-}
    ports:
      - "8086:8086"
      - "8089:8089"

  payment-simulator:
    build: ./payment-simulator
    network_mode: "service:payment-service"
    depends_on:
      payment-service:
        condition: service_started
    environment:
      SIMULATOR_PORT: ${SIMULATOR_PORT:-8089}
      SIMULATOR_PUBLIC_ORIGIN: ${SIMULATOR_PUBLIC_ORIGIN:-http://localhost:8089}
      SIMULATOR_FRONTEND_RETURN_URL: ${SIMULATOR_FRONTEND_RETURN_URL:-http://localhost:5173/checkout}
      SIMULATOR_CREDENTIAL_HEADER: ${PAYMENT_PROVIDER_CREDENTIAL_HEADER:-X-Provider-Key}
      SIMULATOR_CREDENTIAL: ${PAYMENT_PROVIDER_CREDENTIAL:-demo-provider-dev-key-0123456789}
      SIMULATOR_WEBHOOK_URL: ${SIMULATOR_WEBHOOK_URL:-http://127.0.0.1:8086/api/v1/payments/webhooks/demo-provider}
      SIMULATOR_WEBHOOK_SECRET: ${PAYMENT_PROVIDER_WEBHOOK_SECRET:-demo-provider-webhook-secret-0123456789}
      SIMULATOR_STATE_FILE: ${SIMULATOR_STATE_FILE:-/tmp/payment-simulator-state.json}
    restart: unless-stopped

  product-service:
    <<: *eureka-client
    build: ./product-service
    volumes:
      - ./product-service/src:/app/src:ro
    environment:
      <<: *eureka-client-env
      PRODUCT_IDENTITY_BASE_URL: http://identity-service:8083
      IDENTITY_INTERNAL_TOKEN_PRODUCT: ${E1_PRODUCT_TO_IDENTITY_TOKEN:-}
      PRODUCT_ORDER_BASE_URL: http://order-service:8085
      PRODUCT_ORDER_SERVICE_TOKEN: ${E1_PRODUCT_TO_ORDER_TOKEN:-}
      PRODUCT_INTERNAL_TOKENS_ORDER: ${E1_ORDER_TO_PRODUCT_TOKEN:-}
      PRODUCT_INTERNAL_TOKENS_CART: ${E1_CART_TO_PRODUCT_TOKEN:-}
      PRODUCT_MEDIA_ENDPOINT: http://object-storage:8333
      PRODUCT_MEDIA_PUBLIC_ENDPOINT: http://localhost:${S3_HOST_PORT:-8333}
    ports:
      - "8087:8087"

  kafka:
    image: apache/kafka:4.4.0
    container_name: ecom-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:29092"

  sqs:
    image: softwaremill/elasticmq-native:1.7.1
    container_name: ecom-sqs
    ports:
      - "9324:9324"
volumes:
  postgres-data:
  object-storage-data:
