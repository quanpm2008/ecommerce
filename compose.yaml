x-eureka-client: &eureka-client
  depends_on:
    discovery-service:
      condition: service_healthy
    database:
      condition: service_healthy
  environment: &eureka-client-env
    SPRING_APPLICATION_JSON: '{"eureka":{"client":{"serviceUrl":{"defaultZone":"http://discovery-service:8761/eureka/"}}}}'
    SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/ecommerce
    SPRING_DATASOURCE_USERNAME: ecommerce
    SPRING_DATASOURCE_PASSWORD: ecommerce

services:
  # shortcut: shared database and credentials for dev, split before production.
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 12

  # S3-compatible object storage (SeaweedFS) for presigned media uploads. Dev credentials in identity-service/infra/seaweedfs/s3.json.
  object-storage:
    image: chrislusf/seaweedfs:4.45
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -ip.bind=0.0.0.0
    ports:
      - "127.0.0.1:${S3_HOST_PORT:-8333}:8333"
    volumes:
      - ./identity-service/infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - object-storage-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  discovery-service:
    build: ./discovery-service
    volumes:
      - ./discovery-service/src:/app/src:ro
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  cart-service:
    <<: *eureka-client
    build: ./cart-service
    volumes:
      - ./cart-service/src:/app/src:ro
    ports:
      - "8080:8080"

  gateway-service:
    <<: *eureka-client
    build: ./gateway-service
    volumes:
      - ./gateway-service/src:/app/src:ro
    ports:
      - "8081:8081"

  finance-service:
    <<: *eureka-client
    build: ./finance-service
    volumes:
      - ./finance-service/src:/app/src:ro
    ports:
      - "8082:8082"

  identity-service:
    <<: *eureka-client
    build: ./identity-service
    volumes:
      - ./identity-service/src:/app/src:ro
    environment:
      <<: *eureka-client-env
      # Uploads are signed for the browser's view of the storage; identity itself talks to it inside the network.
      IDENTITY_MEDIA_ENDPOINT: http://object-storage:8333
      IDENTITY_MEDIA_PUBLIC_ENDPOINT: http://localhost:${S3_HOST_PORT:-8333}
    ports:
      - "8083:8083"

  notification-service:
    <<: *eureka-client
    build: ./notification-service
    volumes:
      - ./notification-service/src:/app/src:ro
    ports:
      - "8084:8084"

  order-service:
    <<: *eureka-client
    build: ./order-service
    volumes:
      - ./order-service/src:/app/src:ro
    ports:
      - "8085:8085"

  payment-service:
    <<: *eureka-client
    build: ./payment-service
    volumes:
      - ./payment-service/src:/app/src:ro
    ports:
      - "8086:8086"

  product-service:
    <<: *eureka-client
    build: ./product-service
    volumes:
      - ./product-service/src:/app/src:ro
    ports:
      - "8087:8087"

volumes:
  postgres-data:
  object-storage-data:
