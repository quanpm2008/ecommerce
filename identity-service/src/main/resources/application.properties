spring.application.name=identity-service
server.port=8083
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Host-run default; Docker and tests override via SPRING_DATASOURCE_* / @ServiceConnection.
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce
spring.datasource.username=ecommerce
spring.datasource.password=ecommerce

# Identity owns the "identity" schema in the shared dev database; Flyway creates it and its history table there.
spring.flyway.schemas=identity
spring.flyway.default-schema=identity
spring.jpa.properties.hibernate.default_schema=identity
# Plain JDBC (JdbcTemplate, native queries) resolves unqualified table names in the same schema.
spring.datasource.hikari.schema=identity
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# API §3.5: page starts at 1, default size 20, max 100.
spring.data.web.pageable.one-indexed-parameters=true
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Tokens (API §3.2). Lifetimes follow the P-06 proposal (not final). Without a signing key a temporary RSA key is
# generated at startup, so tokens stop working after a restart: dev only. Set IDENTITY_TOKEN_SIGNING_KEY to a
# PKCS#8 PEM RSA private key (openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048) everywhere else.
identity.token.issuer=ecommerce-identity
identity.token.audience=ecommerce-api
identity.token.access-ttl=PT15M
identity.token.refresh-ttl=P7D
identity.token.signing-key=

logging.pattern.level=%5p [%X{requestId:-}]

# Password reset (API §6.1): the link goes to this trusted FE page with ?token=..., never a client-supplied URL.
identity.password-reset.link-base=http://localhost:3000/reset-password
identity.password-reset.ttl=PT30M

# Per client IP (N-04 gives no numbers). Behind the gateway the IP comes from X-Forwarded-For, trusted only from
# internal addresses (Tomcat's RemoteIpValve defaults).
identity.rate-limit.register.limit=10
identity.rate-limit.register.window=PT1H
identity.rate-limit.forgot-password.limit=5
identity.rate-limit.forgot-password.window=PT15M
server.forward-headers-strategy=native

# Object storage (S3-compatible; SeaweedFS in compose). Uploads go straight from the browser with presigned URLs
# (API §3.9): upload URLs live 10 minutes, read URLs 1 hour. Seller logos up to 2 MB (P-08 proposal).
identity.media.endpoint=http://localhost:8333
identity.media.public-endpoint=http://localhost:8333
identity.media.region=us-east-1
identity.media.access-key=ecommerce
identity.media.secret-key=ecommerce-secret
identity.media.bucket=ecommerce-media
identity.media.upload-url-ttl=PT10M
identity.media.read-url-ttl=PT1H
identity.media.seller-logo-max-bytes=2097152

# Address book limit (P-09).
identity.address.max-per-customer=5

# Region source (API §6.1): provinces.open-api.vn v2 serves the current two-level dataset (34 provinces). The team
# still has to confirm the provider; set GEO_API_BASE_URL to switch, or to empty to turn regions off (503).
# The provider publishes no version, so sourceVersion is this configured label. Cache 24 h (dev proposal).
identity.region.base-url=${GEO_API_BASE_URL:https://provinces.open-api.vn/api/v2}
identity.region.dataset-version=${GEO_API_DATASET_VERSION:provinces-open-api-vn-v2}
identity.region.timeout=${GEO_API_TIMEOUT:PT3S}
identity.region.cache-ttl=PT24H

# order-service's internal API, asked whether a customer has a paid order when banning (G-14). Unavailable → 503.
identity.order.base-url=${IDENTITY_ORDER_BASE_URL:http://localhost:8085}
identity.order.timeout=PT2S

# Outbox relay (API §7.2): publishes pending events in order. No broker is chosen yet, so nothing is sent and events
# stay PENDING; the relay still runs and starts publishing as soon as an EventPublisher for a broker is added.
identity.outbox.relay.enabled=true
identity.outbox.relay.interval=PT2S
identity.outbox.relay.batch-size=100

# API docs (springdoc): OpenAPI JSON at /v3/api-docs (import into Postman), Swagger UI at /swagger-ui.html.
# identity-service/openapi.json and api.html are regenerated by OpenApiDocsTests.
springdoc.api-docs.enabled=${IDENTITY_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${IDENTITY_API_DOCS_ENABLED:true}
springdoc.paths-to-match=/api/**,/internal/**,/.well-known/**
springdoc.override-with-generic-response=false
springdoc.writer-with-order-by-keys=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Services allowed to call /internal/v1/identity, each with its own X-Service-Token (≥ 32 characters), keyed by the
# caller's spring.application.name. None by default: every internal call is refused until they are set through
# IDENTITY_INTERNAL_TOKEN_<SERVICE> (see DEVELOPMENT.md). The calling service sends the same value.
identity.internal.clients.gateway-service=${IDENTITY_INTERNAL_TOKEN_GATEWAY:}
identity.internal.clients.cart-service=${IDENTITY_INTERNAL_TOKEN_CART:}
identity.internal.clients.order-service=${IDENTITY_INTERNAL_TOKEN_ORDER:}
identity.internal.clients.payment-service=${IDENTITY_INTERNAL_TOKEN_PAYMENT:}
identity.internal.clients.finance-service=${IDENTITY_INTERNAL_TOKEN_FINANCE:}
identity.internal.clients.notification-service=${IDENTITY_INTERNAL_TOKEN_NOTIFICATION:}
identity.internal.clients.product-service=${IDENTITY_INTERNAL_TOKEN_PRODUCT:}
