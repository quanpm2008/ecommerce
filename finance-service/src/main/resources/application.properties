spring.application.name=finance-service
server.port=8082
finance.identity.service-token=${FINANCE_IDENTITY_SERVICE_TOKEN:}
finance.order.credential=${FINANCE_ORDER_CREDENTIAL:}
finance.payment.credential=${FINANCE_PAYMENT_CREDENTIAL:}
spring.cloud.openfeign.client.config.default.connectTimeout=2000
spring.cloud.openfeign.client.config.default.readTimeout=2000
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
spring.flyway.default-schema=finance
spring.flyway.schemas=finance
spring.jpa.properties.hibernate.default_schema=finance
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
