spring.application.name=cart-service
server.port=8080
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Host-run default; Docker and tests override via SPRING_DATASOURCE_* / @ServiceConnection.
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce
spring.datasource.username=ecommerce
spring.datasource.password=ecommerce

# Cart owns the "cart" schema in the shared dev database; Flyway creates it and its history table there.
spring.flyway.schemas=cart
spring.flyway.default-schema=cart
spring.jpa.properties.hibernate.default_schema=cart
spring.datasource.hikari.schema=cart
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

logging.pattern.level=%5p [%X{requestId:-}]

# X-Service-Token this service presents on internal calls. Identity must list the same value as
# identity.internal.clients.cart-service (IDENTITY_INTERNAL_TOKEN_CART, >= 32 characters). Empty = every call to
# Identity is refused, so every cart request answers 503.
cart.internal.service-token=${CART_SERVICE_TOKEN:}

# Direct base URLs for the services Cart calls. Empty = resolve the service name through Eureka.
cart.clients.identity-url=${CART_IDENTITY_URL:}
cart.clients.product-url=${CART_PRODUCT_URL:}
cart.clients.order-url=${CART_ORDER_URL:}
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000

# checkout.paid consumer (API §7.2). Kafka is not in the compose stack yet, so the listener is off by default.
cart.events.kafka.enabled=${CART_KAFKA_ENABLED:false}
cart.events.checkout-paid-topic=${CART_CHECKOUT_PAID_TOPIC:checkout.paid}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=cart-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
