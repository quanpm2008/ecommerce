spring.application.name=notification-service
server.port=8084
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Service-owned schema; tests use an isolated PostgreSQL container.
spring.datasource.url=${NOTIFICATION_DATABASE_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${NOTIFICATION_DATABASE_USERNAME:ecommerce}
spring.datasource.password=${NOTIFICATION_DATABASE_PASSWORD:ecommerce}
spring.flyway.schemas=notification
spring.flyway.default-schema=notification
spring.datasource.hikari.schema=notification
logging.pattern.level=%5p [%X{requestId:-}]

notification.clients.identity-url=${NOTIFICATION_IDENTITY_URL:}
notification.internal.service-token=${NOTIFICATION_SERVICE_TOKEN:}
notification.internal.clients.identity-service=${NOTIFICATION_INTERNAL_TOKEN_IDENTITY:}
notification.internal.clients.product-service=${NOTIFICATION_INTERNAL_TOKEN_PRODUCT:}
notification.internal.clients.order-service=${NOTIFICATION_INTERNAL_TOKEN_ORDER:}
notification.internal.clients.payment-service=${NOTIFICATION_INTERNAL_TOKEN_PAYMENT:}
notification.internal.clients.finance-service=${NOTIFICATION_INTERNAL_TOKEN_FINANCE:}
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=2000

# No broker required for internal POST ingestion; enable only with trusted Kafka producers/ACLs.
notification.events.kafka.enabled=${NOTIFICATION_KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record

# Physical content cleanup; reads enforce P-22 even between runs. Not a delivery SLA.
notification.retention.enabled=true
notification.retention.interval=PT1H