spring.application.name=order-service
server.port=8085
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
spring.flyway.default-schema=orders
spring.flyway.schemas=orders
order.internal.tokens.product=${ORDER_INTERNAL_TOKEN_PRODUCT:}
order.internal.tokens.cart=${ORDER_INTERNAL_TOKEN_CART:}
order.internal.tokens.payment=${ORDER_INTERNAL_TOKEN_PAYMENT:}
order.payment.base-url=${ORDER_PAYMENT_BASE_URL:http://localhost:8086}
order.payment.service-token=${ORDER_PAYMENT_SERVICE_TOKEN:}
spring.cloud.openfeign.client.config.paymentCheckout.connectTimeout=2000
spring.cloud.openfeign.client.config.paymentCheckout.readTimeout=2000
spring.cloud.openfeign.client.config.identitySaleEvidence.connectTimeout=2000
spring.cloud.openfeign.client.config.identitySaleEvidence.readTimeout=2000
spring.cloud.openfeign.client.config.productSaleEvidence.connectTimeout=2000
spring.cloud.openfeign.client.config.productSaleEvidence.readTimeout=2000
spring.task.scheduling.pool.size=4
