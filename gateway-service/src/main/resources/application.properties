spring.application.name=gateway-service
server.port=8081

# In Docker, compose sets the Eureka URL through SPRING_APPLICATION_JSON (a plain env var can't keep the camelCase
# defaultZone key).
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# The gateway has no database. Only health is exposed over HTTP, and without details (component names would leak the
# topology); downstream services' actuators are never routed.
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Routing (checklist §1): the route table is ServiceRoute; services are found through Eureka. The response timeout must
# outlast the slowest endpoint: a payment waits up to 15 s for the simulator (P-02). No response in time, connection
# refused or no instance → 503 SERVICE_UNAVAILABLE.
gateway.proxy.connect-timeout=${GATEWAY_CONNECT_TIMEOUT:2s}
spring.cloud.gateway.server.webflux.httpclient.response-timeout=${GATEWAY_READ_TIMEOUT:30s}
# Instances come straight from the Eureka client (LoadBalancingConfig): the LoadBalancer cache (35 s) would only delay
# the moment a deregistered instance stops getting traffic.
spring.cloud.loadbalancer.cache.enabled=false
# The gateway serves no static files; unknown paths go straight to the 404 envelope.
spring.web.resources.add-mappings=false

# Access tokens (checklist §3): RS256 from identity-service, checked against its JWKS (fetched on the first token and
# cached; fetched again for an unknown key id). iss, aud, exp (with clock skew), sub and sessionId are checked here;
# permissions and session state are checked by each service with Identity.
gateway.jwt.issuer=${GATEWAY_JWT_ISSUER:ecommerce-identity}
gateway.jwt.audience=${GATEWAY_JWT_AUDIENCE:ecommerce-api}
gateway.jwt.jwk-set-uri=${GATEWAY_JWT_JWK_SET_URI:http://localhost:8083/.well-known/jwks.json}
gateway.jwt.clock-skew=${GATEWAY_JWT_CLOCK_SKEW:60s}
gateway.jwt.jwks-timeout=${GATEWAY_JWT_JWKS_TIMEOUT:2s}

# Request headers (checklist §4): routing.ProxiedRequestHeaders sets X-Forwarded-* from the connection itself and drops
# whatever a client sent, so the gateway's own (appending) forwarded-header filters are off.
spring.cloud.gateway.server.webflux.x-forwarded.enabled=false
spring.cloud.gateway.server.webflux.forwarded.enabled=false
# The request id (web.RequestIdFilter) is in the MDC of every log line for the request, across Reactor threads.
spring.reactor.context-propagation=auto
logging.pattern.level=%5p [requestId=%X{requestId:-}]

# CORS (checklist §6, decision 0001): the SPA's exact origins for this environment, comma-separated; credentials are
# allowed so identity's refresh cookie is sent. No wildcard.
gateway.cors.allowed-origins=${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:5173}
gateway.cors.max-age=${GATEWAY_CORS_MAX_AGE:30m}
# Largest request body forwarded (decision 0002); media uploads go straight to object storage.
gateway.limits.max-body-size=${GATEWAY_MAX_BODY_SIZE:1MB}
# Rate limits per client IP and gateway instance (checklist §7, decision 0002; N-04 has no official numbers yet).
gateway.rate-limit.sensitive.requests=${GATEWAY_RATE_LIMIT_SENSITIVE_REQUESTS:10}
gateway.rate-limit.sensitive.window=${GATEWAY_RATE_LIMIT_SENSITIVE_WINDOW:1m}
gateway.rate-limit.general.requests=${GATEWAY_RATE_LIMIT_GENERAL_REQUESTS:300}
gateway.rate-limit.general.window=${GATEWAY_RATE_LIMIT_GENERAL_WINDOW:1m}
